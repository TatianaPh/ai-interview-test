
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Interview — голосовой ввод</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #20352f;
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 650px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
    }

    button {
      padding: 14px 20px;
      margin: 8px 8px 8px 0;
      border: 0;
      border-radius: 10px;
      background: #397963;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      line-height: 1.6;
    }

    audio {
      width: 100%;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Голосовой ввод</h1>

    <p>
      Запишите ответ на вопрос интервью.
    </p>

    <button id="start" type="button">
      🎤 Начать запись
    </button>

    <button id="stop" type="button" disabled>
      ■ Остановить
    </button>

    <p id="status" role="status">
      Микрофон пока не включён.
    </p>

    <audio id="player" controls></audio>
  </main>

  <script>
    let recorder = null;
    let stream = null;
    let chunks = [];
    let audioUrl = null;

    const MAX_AUDIO_BYTES = 4 * 1024 * 1024;
    const MAX_RECORDING_MS = 120000;

    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");
    const player = document.getElementById("player");

    // Освобождаем микрофон после завершения записи.
    function releaseMicrophone() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    // Проверяем, поддерживается ли нужный формат аудио.
    function selectAudioFormat() {
      if (typeof MediaRecorder === "undefined") {
        return null;
      }

      const formats = [
        { mime: "audio/webm;codecs=opus", ext: "webm" },
        { mime: "audio/webm", ext: "webm" },
        { mime: "audio/mp4", ext: "mp4" }
      ];

      return formats.find(format =>
        MediaRecorder.isTypeSupported(format.mime)
      ) || null;
    }

    // Преобразуем запись в base64 для передачи сообщением.
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const result = String(reader.result || "");
          resolve(result.split(",")[1] || "");
        };

        reader.onerror = () => {
          reject(new Error("Не удалось прочитать аудиозапись."));
        };

        reader.readAsDataURL(blob);
      });
    }

    startButton.onclick = async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Запись не поддерживается браузером."
          );
        }

        const format = selectAudioFormat();

        if (!format) {
          throw new Error(
            "Браузер не поддерживает формат записи."
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        recorder = new MediaRecorder(stream, {
          mimeType: format.mime
        });

        chunks = [];

        recorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        recorder.onstop = async () => {
          releaseMicrophone();

          startButton.disabled = true;
          stopButton.disabled = true;

          try {
            const blob = new Blob(chunks, {
              type: format.mime
            });

            chunks = [];

            if (!blob.size) {
              throw new Error("Аудиозапись оказалась пустой.");
            }

            if (blob.size > MAX_AUDIO_BYTES) {
              throw new Error(
                "Запись превышает 4 МБ. Запишите ответ короче."
              );
            }

            if (audioUrl) {
              URL.revokeObjectURL(audioUrl);
            }

            audioUrl = URL.createObjectURL(blob);
            player.src = audioUrl;

            status.textContent =
              "Запись готова. Можно прослушать её.";

            // Передача аудио будет подключена после
            // добавления принимающего обработчика в GAS.
            // Пока аудио остаётся в браузере.
          } catch (error) {
            status.textContent =
              "Ошибка обработки записи: " + error.message;
          } finally {
            startButton.disabled = false;
          }
        };

        recorder.onerror = () => {
          releaseMicrophone();
          chunks = [];
          startButton.disabled = false;
          stopButton.disabled = true;
          status.textContent = "Ошибка записи аудио.";
        };

        recorder.start();

        startButton.disabled = true;
        stopButton.disabled = false;
        status.textContent = "Идёт запись...";

        // Автоматически ограничиваем длительность записи.
        const currentRecorder = recorder;

        setTimeout(() => {
          if (currentRecorder.state === "recording") {
            currentRecorder.stop();
          }
        }, MAX_RECORDING_MS);

      } catch (error) {
        releaseMicrophone();

        startButton.disabled = false;
        stopButton.disabled = true;

        status.textContent =
          "Ошибка микрофона: " + error.message;
      }
    };

    stopButton.onclick = () => {
      if (recorder && recorder.state === "recording") {
        status.textContent = "Подготавливаем запись...";
        recorder.stop();
      }
    };

    window.addEventListener("pagehide", () => {
      releaseMicrophone();

      if (audioUrl) {
        URL.revokeObjectURL(audioUrl);
      }
    });
  </script>
</body>
</html>
